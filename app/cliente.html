<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Seu projeto · Voltec</title>
  <meta name="description" content="Veja como a luz do seu projeto fica à noite, antes de instalar. Voltec Soluções Elétricas.">
  <meta name="theme-color" content="#022449">
  <link rel="icon" href="img/icon-192.png">
  <link rel="stylesheet" href="vendor/montserrat.css">
  <link rel="stylesheet" href="css/cliente.css">
</head>
<body>
  <header class="topo">
    <img src="img/logo-branca.svg" alt="Voltec Soluções Elétricas" class="logo">
    <span id="rgTopo" class="rg"></span>
  </header>

  <main>
    <section id="inicio" class="inicio">
      <div class="inicio-caixa">
        <img class="eletricista-grande" src="img/eletricista.png" alt="Eletricista Voltec" width="240" height="494">
        <h1>Veja o seu projeto</h1>
        <p id="rgInicio" class="rg-grande"></p>
        <p class="apoio">Como a luz vai ficar à noite, antes de instalar. Você escolhe a potência e a cor, e vê o resultado na hora.</p>
        <button id="ver" class="botao-grande" type="button" disabled>Ver meu projeto</button>
        <p id="avisoTexto" class="aviso" role="alert" hidden></p>
      </div>
    </section>

    <section id="palco">
      <iframe id="obraCliente" title="Simulação 3D do seu projeto"></iframe>

      <div id="painel">
        <div class="progresso" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

        <div class="guia">
          <img class="eletricista" src="img/eletricista.png" alt="Eletricista Voltec" width="150" height="308">
          <div class="balao" role="status" aria-live="polite">
            <p id="falaTexto"></p>
          </div>
        </div>

        <div id="controles">
          <div class="grupo" data-grupo="intensidade" hidden>
            <p class="nome">Potência</p>
            <div class="opcoes"></div>
          </div>
          <div class="grupo" data-grupo="temperatura" hidden>
            <p class="nome">Cor da luz</p>
            <div class="opcoes"></div>
          </div>
        </div>

        <div id="resultado" class="resultado" hidden>
          <p class="resultado-titulo">Resultado da sua escolha</p>
          <p id="resultadoTexto"></p>
        </div>

        <button id="proximo" class="botao" type="button">Próximo</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/cliente.js"></script>
</body>
</html>
