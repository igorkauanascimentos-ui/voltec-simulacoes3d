<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Voltec · Simulações 3D</title>
  <meta name="theme-color" content="#12233A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <img src="img/selo.jpg" alt="Voltec Soluções Elétricas" class="selo">
    <span class="marca-rg">RG Elétrico</span>
  </header>

  <main>
    <section id="lista" class="tela">
      <p class="sobretitulo">Obras</p>
      <h1>Escolha o RG</h1>
      <div id="cards" class="cards"></div>
      <p id="aviso" class="aviso" hidden></p>
    </section>

    <section id="senha" class="tela" hidden>
      <form id="formSenha" class="form">
        <p class="sobretitulo" id="senhaRG"></p>
        <h1>Digite a senha</h1>
        <label for="campoSenha">Senha da obra</label>
        <input id="campoSenha" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button type="submit" class="botao">Abrir</button>
        <button type="button" id="voltarLista" class="link">Voltar às obras</button>
        <p id="erroSenha" class="erro" role="alert" hidden></p>
      </form>
    </section>

    <section id="visor" class="visor" hidden>
      <div class="barra">
        <button type="button" id="trocar" class="link">← Trocar obra</button>
        <span id="visorRG" class="visor-rg"></span>
      </div>
      <iframe id="obra" title="Simulação 3D da obra" sandbox="allow-scripts allow-same-origin"></iframe>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
