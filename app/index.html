<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Voltec · Simulações de iluminação</title>
  <meta name="description" content="Simulação de iluminação da sua obra. Voltec Soluções Elétricas, eletricista.">
  <meta name="theme-color" content="#022449">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon-192.png">
  <link rel="stylesheet" href="vendor/montserrat.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <img src="img/logo-branca.svg" alt="Voltec Soluções Elétricas" class="logo">
    <span class="tag">Simulações 3D</span>
  </header>

  <main>
    <section id="lista" class="tela">
      <div class="hero">
        <p class="sobretitulo">Antes da obra</p>
        <h1>Veja como a luz<br><span class="destaque">vai ficar</span></h1>
        <p class="apoio">Digite o número do RG da sua obra e a senha que a Voltec enviou.</p>
      </div>
      <p class="rotulo">Suas obras</p>
      <div id="cards" class="cards"></div>
      <p id="aviso" class="aviso" hidden></p>
    </section>

    <section id="senha" class="tela" hidden>
      <form id="formSenha" class="form">
        <p class="sobretitulo" id="senhaRG"></p>
        <h1>Digite a senha</h1>
        <label for="campoSenha">Senha da obra</label>
        <input id="campoSenha" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
        <button type="submit" class="botao">Abrir simulação</button>
        <button type="button" id="voltarLista" class="link">Voltar às obras</button>
        <p id="erroSenha" class="erro" role="alert" hidden></p>
      </form>
    </section>

    <section id="visor" class="visor" hidden>
      <div class="barra">
        <button type="button" id="trocar" class="link">← Obras</button>
        <span id="visorRG" class="visor-rg"></span>
      </div>
      <iframe id="obra" title="Simulação 3D da obra" sandbox="allow-scripts allow-same-origin"></iframe>
    </section>
  </main>

  <footer class="rodape">Voltec Soluções Elétricas · eletricista</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
